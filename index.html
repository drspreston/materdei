<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mater Dei • Sanctuary Activation</title>
  <style>
    :root {
      --bg: #FAF9F6;
      --card-bg: #FFFFFF;
      --primary: #3C1361;
      --accent: #B78628;
      --border: #E5DEC9;
      --border-dark: #D8CFBC;
      --text: #2B262D;
      --muted: #7A7265;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .gate-card {
      background: var(--card-bg);
      border: 1px solid var(--border-dark);
      border-radius: 18px;
      padding: 36px 26px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 30px rgba(60, 19, 97, 0.08);
      position: relative;
    }
    .monogram {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 22px;
    }
    h1 {
      font-family: Georgia, serif;
      color: var(--primary);
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
      text-align: center;
      border: 1.5px solid var(--border-dark);
      border-radius: 10px;
      margin-bottom: 14px;
      background: var(--bg);
      color: var(--primary);
      outline: none;
      user-select: text;
    }
    input:focus {
      border-color: var(--accent);
      background: #FFFFFF;
    }
    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(60, 19, 97, 0.25);
    }
    button:active { transform: scale(0.98); }
    .error-msg {
      color: #B22222;
      font-size: 12px;
      margin-top: 14px;
      display: none;
      font-weight: 500;
    }
  </style>

  <script>
    // IF USER HAS ALREADY ENTERED CODE BEFORE, REDIRECT IMMEDIATELY
    if (localStorage.getItem("mater_dei_unlocked") === "true") {
      window.location.replace("prayerTracker.html");
    }
  </script>
</head>
<body>

  <div class="gate-card">
    <div class="monogram">☩</div>
    <h1>Mater Dei Sanctuary</h1>
    <p>Please enter your personal Access Code from Page 1 of your <em>Welcome Guide</em> to unlock your prayer app.</p>

    <input type="text" id="accessInput" placeholder="ENTER ACCESS CODE" autocomplete="off" autocorrect="off" autocapitalize="characters">
    <button onclick="submitCode()">ACTIVATE SANCTUARY →</button>
    
    <div class="error-msg" id="errorMsg">Invalid code. Please check your Welcome PDF guide.</div>
  </div>

  <div style="font-size: 11px; color: var(--muted); margin-top: 24px;">
    © 2026 Mater Dei Creative • Personal Devotional License
  </div>

  <script>
    // The valid access code (tolerant to dashes, spaces, and case)
    const SECRET_CODE = "MATERDEI2026";

    function submitCode() {
      const raw = document.getElementById("accessInput").value;
      // Clean input: remove hyphens, spaces, symbols
      const cleaned = raw.toUpperCase().replace(/[^A-Z0-9]/g, "");

      if (cleaned === SECRET_CODE) {
        // Save authorization permanently on this device
        localStorage.setItem("mater_dei_unlocked", "true");
        // Forward to the app
        window.location.replace("prayerTracker.html");
      } else {
        const err = document.getElementById("errorMsg");
        err.style.display = "block";
        const input = document.getElementById("accessInput");
        input.style.borderColor = "#B22222";
        input.value = "";
      }
    }

    // Allow pressing "Enter" on mobile or keyboard
    document.getElementById("accessInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") submitCode();
    });
  </script>

</body>
</html>
